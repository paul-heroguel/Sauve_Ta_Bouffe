<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mes commandes - SauveTaBouffe</title><link rel="stylesheet" href="style.css"></head>
<body><nav class="barre-nav"><div class="nav-logo"><div class="nav-logo-img"><img src="image/logo.png" alt="SauveTaBouffe" style="width:100%;height:100%;border-radius:50%;"></div><span>SauveTaBouffe</span></div><ul class="nav-menu"><li><a href="index.html">Accueil</a></li><li><a href="prestations.html">Prestations</a></li><li><a href="panier.html">Panier</a></li><li><a href="compte.html">Compte</a></li><li><a href="mes-commandes.html" class="active">Mes commandes</a></li></ul></nav>
<main class="section-commandes"><div class="conteneur-commandes"><h1 class="titre-commandes">Mes commandes</h1><p style="text-align:center">Retrouvez vos paiements, votre QR code de retrait et l’avancement de chaque commande.</p><div id="grille-commandes" class="grille-commandes"></div></div></main>
<footer><div class="footer-socials"><a href="https://www.facebook.com/profile.php?id=61586650501807" target="_blank"><img src="image/FaceBook.png" alt="Facebook"></a><a href="https://www.instagram.com/sauvetabouffe_lens/" target="_blank"><img src="image/Instagram.png" alt="Instagram"></a><a href="https://www.tiktok.com/@sauvetabouffe62" target="_blank"><img src="image/TikTok.png" alt="TikTok"></a><a href="https://www.youtube.com/@SauveTaBouffe62" target="_blank"><img src="image/YouTube.png" alt="YouTube"></a></div><p>&copy; 2025 SauveTaBouffe - Lutter contre le gaspillage alimentaire dans le Nord-Pas-de-Calais</p></footer>
<script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const zone=document.getElementById('grille-commandes');const reservations=JSON.parse(localStorage.getItem('sauveTaBouffeReservations')||'[]').slice().reverse();if(!reservations.length){zone.innerHTML='<div class="commande-vide"><h2>Aucune commande</h2><p>Vos futures réservations payées apparaîtront ici.</p><a class="bouton-mini" href="prestations.html">Découvrir les paniers</a></div>';return;}reservations.forEach(r=>{const statut=statutCommande(r),etape=etapeStatut(statut),article=document.createElement('article');article.id=r.reference;article.className='commande-detail';article.innerHTML=`<div class="commande-haut"><div><div class="commande-reference">${echapperHTML(r.reference)}</div><h2>${echapperHTML(r.panier)}</h2></div><span class="commande-statut">${echapperHTML(statut)}</span></div><div class="commande-contenu"><div><p><strong>${echapperHTML(r.quantite)} panier(s)</strong> — ${Number(r.total).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}</p><p>📅 ${echapperHTML(r.date)}</p><p>📍 ${echapperHTML(r.retrait)}</p><p>💳 ${echapperHTML(r.paiement||'Carte bancaire')}</p><div class="suivi-commande"><div class="etape-suivi ${etape>=1?'active':''}">En préparation</div><div class="etape-suivi ${etape>=2?'active':''}">Prête à récupérer</div><div class="etape-suivi ${etape>=3?'active':''}">Récupérée</div></div><div class="commandes-actions"><button class="bouton-mini" type="button" onclick="telechargerFacture('${echapperHTML(r.reference)}')">Facture PDF</button><a class="bouton-mini secondaire" href="prestations.html">Commander à nouveau</a></div></div><img class="commande-qr" src="${urlQRCode(r)}" alt="QR code ${echapperHTML(r.reference)}"></div>`;zone.appendChild(article);});const cible=location.hash.slice(1);if(cible)setTimeout(()=>document.getElementById(cible)?.scrollIntoView({behavior:'smooth',block:'center'}),100);});
</script></body></html>
